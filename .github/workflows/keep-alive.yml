name: Keep Alive - Punto Maple

# Render (plan free) duerme el servicio tras ~15 min sin tráfico.
# Este workflow lo despierta cada 10 minutos, las 24 horas.
# Para limitarlo a horario comercial de Argentina (08:00-18:50 local, UTC-3):
#   cron: '*/10 11-21 * * *'

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          echo "Ping a $(date -u +'%Y-%m-%dT%H:%M:%SZ') UTC"
          curl --fail --silent --show-error --max-time 30 \
            https://punto-maple-backend.onrender.com/api/health
          echo
